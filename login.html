<script>

(async function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const page=document.body.dataset.page||'home', prefix=document.body.dataset.prefix||'';
const categories=[['📱','Electronics & Phones'],['🚗','Cars & Motorcycles'],['🏡','Houses & Apartments'],['🛋️','Furniture'],['👟','Clothes & Shoes'],['🧰','Tools & Construction'],['🎪','Event Equipment'],['🧊','Home Appliances'],['📦','Other Products']];
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const products=()=>dbProducts;

const SUPABASE_URL='https://exkjkcknubkeiywbfscu.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_To9fRUnhevIwO7Mka4nGpA_0uTUNvvJ';
const supabase = window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let dbProducts=[];
let currentUser=null;
let currentProfile=null;
async function loadMarketplaceData(){
  if(!supabase) return;
  const {data,error}=await supabase.from('products').select('*').order('created_at',{ascending:false});
  if(error){console.warn('Products load:',error.message);return;}
  dbProducts=(data||[]).map(p=>({id:p.id,title:p.title,mode:p.mode,category:p.category,price:Number(p.price),period:p.rental_period,location:p.location,image:p.image_url,description:p.description,seller_id:p.seller_id,status:p.status}));
}
async function loadCurrentProfile(){
  if(!supabase)return;
  const {data:{session}}=await supabase.auth.getSession();
  currentUser=session?.user||null;
  if(currentUser){
    const {data,error}=await supabase.from('profiles').select('id,full_name,role').eq('id',currentUser.id).maybeSingle();
    if(!error) currentProfile=data;
  }
}
function dashboardUrl(role){
  return (prefix||'')+(role==='seller'?'seller.html':role==='admin'?'admin.html':'buyer.html');
}
async function requireRole(expected){
  if(!currentUser){location.replace(link('login.html?next='+encodeURIComponent(location.pathname+location.search)));return false;}
  if(!currentProfile){await loadCurrentProfile();}
  if(!currentProfile){toast('Account profile is not ready. Please sign in again.');return false;}
  if(expected!=='admin' && currentProfile.role!==expected){location.replace(dashboardUrl(currentProfile.role));return false;}
  if(expected==='admin' && currentProfile.role!=='admin'){toast('You are not authorized to open the Admin Dashboard.');location.replace(dashboardUrl(currentProfile.role));return false;}
  return true;
}

const money=n=>'RWF '+Number(n||0).toLocaleString('en-US');
function toast(msg){let t=$('#toast');if(t){t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}}

function categoryTiles(){return `<div class="category-grid">${categories.map(([ic,n])=>`<a class="category-tile" href="${link('categories.html')}"><span class="cat-icon">${ic}</span><span><b>${n}</b><small>Explore listings</small></span></a>`).join('')}</div>`}
function card(p){let badge=p.mode==='rent'?'FOR RENT':'FOR SALE',price=p.mode==='rent'?`${money(p.price)} <small>/ ${p.period||'day'}</small>`:money(p.price);let photo=p.image?`<img src="${p.image}" alt="">`:(p.emoji||'📦');return `<article class="product-card"><a href="${link('product.html')}?id=${encodeURIComponent(p.id)}" class="product-photo">${photo}<span class="pill ${p.mode==='rent'?'rent':'sale'}">${badge}</span></a><div class="product-info"><h3>${esc(p.title)}</h3><p>${esc(p.category||'Other Products')}</p><div class="price-row"><span class="price">${price}</span><a class="btn btn-light" style="padding:8px 12px;font-size:10px" href="${link('product.html')}?id=${encodeURIComponent(p.id)}">View</a></div><div class="location">📍 ${esc(p.location||'Rwanda')}</div></div></article>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function productList(mode){let list=products().filter(p=>p.mode===mode);return list.length?list.map(card).join(''):`<div class="empty-state"><strong>No ${mode==='rent'?'rental':'sale'} listings yet</strong>New verified listings will appear here when sellers publish them.</div>`}

function listing(mode){shell(`<main><section class="page-hero"><div class="container"><div class="crumb">Home / ${mode==='rent'?'Rent':'Buy'}</div><div class="page-heading"><span class="eyebrow">${mode==='rent'?'FLEXIBLE ACCESS':'SHOP LOCAL'}</span><h1>${mode==='rent'?'Rent what you need.':'Find your next great find.'}</h1><p>${mode==='rent'?'Browse items available for daily, weekly or monthly rental.':'Explore products listed for sale by local sellers.'}</p></div></div></section><section class="section"><div class="container"><div class="filterbar"><div class="searchbox">⌕ <input id="searchProducts" placeholder="Search products..."></div><select id="categoryFilter"><option value="">All categories</option>${categories.map(c=>`<option>${c[1]}</option>`).join('')}</select><select id="sortFilter"><option value="">Sort: newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="product-grid" id="listingGrid">${productList(mode)}</div></div></section></main>`);let render=()=>{let a=products().filter(p=>p.mode===mode);let q=$('#searchProducts').value.toLowerCase(),c=$('#categoryFilter').value,s=$('#sortFilter').value;a=a.filter(p=>(p.title+' '+p.category).toLowerCase().includes(q)&&(!c||p.category===c));if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);$('#listingGrid').innerHTML=a.length?a.map(card).join(''):`<div class="empty-state"><strong>No matching listings</strong>Try another search or check back later.</div>`};$('#searchProducts').addEventListener('input',render);$('#categoryFilter').addEventListener('change',render);$('#sortFilter').addEventListener('change',render)}
function categoriesPage(){shell(`<main><section class="page-hero"><div class="container"><div class="page-heading"><span class="eyebrow">DISCOVER MORE</span><h1>Explore all categories</h1><p>From everyday essentials to special equipment, start with a category.</p></div></div></section><section class="section"><div class="container">${categoryTiles()}</div></section></main>`)}
function productPage(){let id=new URLSearchParams(location.search).get('id'),p=products().find(x=>String(x.id)===String(id));shell(`<main><section class="section"><div class="container">${p?`<div class="crumb"><a href="${link('index.html')}">Home</a> / Product details</div><div class="detail-grid"><div class="detail-image">${p.image?`<img src="${p.image}" alt="">`:p.emoji||'📦'}</div><div><span class="eyebrow">${p.mode==='rent'?'AVAILABLE FOR RENT':'AVAILABLE TO BUY'}</span><h1 style="font-size:38px;line-height:1.1;letter-spacing:-1.5px">${esc(p.title)}</h1><div class="detail-price">${money(p.price)} ${p.mode==='rent'?`<small style="font-size:13px;color:#68766e">/ ${esc(p.period||'day')}</small>`:''}</div><div class="detail-meta"><span class="meta-chip">${esc(p.category)}</span><span class="meta-chip">📍 ${esc(p.location||'Rwanda')}</span><span class="meta-chip">Seller listing</span></div><p style="color:var(--muted)">${esc(p.description||'Contact the seller for more details about this listing.')}</p><div class="content-card" style="margin:20px 0"><b>Seller information</b><p class="mobile-note">Seller contact and transaction details will be shown after the secure marketplace backend is connected.</p><button class="btn btn-primary" id="inquiryBtn">${p.mode==='rent'?'Request rental':'Buy now'} →</button></div></div></div>`:`<div class="empty-state"><strong>Product not found</strong>Open a listing from Buy or Rent to see its details.<p><a class="btn btn-primary" href="${link('buy.html')}">Browse products</a></p></div>`}</div></section></main>`);$('#inquiryBtn')?.addEventListener('click',()=>toast('Order requests will be enabled after secure account and payment setup.'))}
function about(){shell(`<main><section class="page-hero"><div class="container"><div class="page-heading"><span class="eyebrow">ABOUT ISOKO PLUS</span><h1>One marketplace. More ways to get what you need.</h1><p>ISOKO PLUS is a Rwanda-focused marketplace created to make buying and renting easier, clearer and more convenient.</p></div></div></section><section class="section"><div class="container detail-grid"><div class="content-card"><span class="eyebrow">OUR MISSION</span><h2>Connect people with useful products.</h2><p>We aim to bring buyers, renters and local sellers together in one accessible place. Discover products, explore available options and connect with the people offering them.</p></div><div class="content-card"><span class="eyebrow">BUY SMART</span><h2>Buy what you need.</h2><p>Explore product listings across different categories and find items that fit your needs and budget.</p></div><div class="content-card"><span class="eyebrow">RENT EASY</span><h2>Rent when ownership is not necessary.</h2><p>Find useful items available for a period of time, giving you more flexibility when you only need something temporarily.</p></div><div class="content-card"><span class="eyebrow">OUR COMMITMENT</span><h2>A convenient local marketplace.</h2><p>Our goal is to support local commerce in Rwanda with a marketplace experience that is simple to navigate on phones and computers.</p></div></div></section></main>`)}

Send message →</button></div></div></form></div></section></main>`);$('#contactForm').addEventListener('submit',e=>{e.preventDefault();toast('Thank you. Please use WhatsApp or email to contact our team directly.');e.target.reset()})}
function auth(register){
  shell(`<main><div class="container"><div class="auth-wrap"><div class="content-card"><span class="eyebrow">${register?'JOIN THE MARKETPLACE':'WELCOME BACK'}</span><h1>${register?'Create your account':'Log in to ISOKO PLUS'}</h1><p>${register?'Create your free Buyer / Renter account. You can verify your phone later when opening a Business Account.':'Access your marketplace account securely.'}</p><form id="authForm"><div class="form-grid"><div class="field full"><label>Email address</label><input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field full"><label>Password</label><input id="authPassword" type="password" required minlength="6" autocomplete="${register?'new-password':'current-password'}" placeholder="At least 6 characters"></div>${register?`<div class="field full"><label>Full name</label><input id="authName" required autocomplete="name" placeholder="Your full name"></div><div class="field full"><div class="notice">Your ordinary account is created as a Buyer / Renter. No email confirmation is required. Phone verification will be requested only when you apply for a Business Account.</div></div>`:''}<div class="field full"><button class="btn btn-primary" id="authSubmit" style="width:100%">${register?'Create account':'Log in'} →</button></div></div></form><div class="field full"><button class="btn btn-outline" type="button" id="googleLoginBtn" style="width:100%">Continue with Google</button></div><div class="notice" id="authNotice">Your account is securely managed by Supabase. ${register?'Create your account and start using ISOKO PLUS.':''}</div><p>${register?'Already registered?':'New to ISOKO PLUS?'} <a style="color:var(--green);font-weight:800" href="${link(register?'login.html':'register.html')}">${register?'Log in':'Create an account'}</a></p></div></div></div></main>`);
  $('#authForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#authSubmit'),email=$('#authEmail').value.trim(),password=$('#authPassword').value;
    btn.disabled=true;btn.textContent=register?'Creating account…':'Signing in…';
    try{
      if(!supabase)throw new Error('Supabase client did not load. Check your internet connection.');
      if(register){
        const full_name=$('#authName').value.trim(),role='buyer';
        const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name,role}}});
        if(error)throw error;
        if(!data.session){
          $('#authNotice').textContent='Your account was created, but Supabase is still requiring email confirmation. The project owner must turn OFF Confirm email in Supabase Authentication settings, then try again.';
          toast('Email confirmation is still enabled in Supabase.');
          return;
        }
        currentUser=data.user;
        await loadCurrentProfile();
        if(!currentProfile)throw new Error('Account created, but profile setup is not complete. Please try logging in.');
        toast('Account created successfully.');
        location.href=dashboardUrl('buyer');
      }else{
        const {data,error}=await supabase.auth.signInWithPassword({email,password});
        if(error)throw error;
        currentUser=data.user;await loadCurrentProfile();
        if(!currentProfile)throw new Error('Your profile is not ready yet. Please contact support.');
        location.href=dashboardUrl(currentProfile.role);
      }
    }catch(err){toast(err.message||'Authentication failed.');$('#authNotice').textContent=err.message||'Authentication failed.';}
    finally{btn.disabled=false;btn.textContent=register?'Create account →':'Log in →';}
  });
  $('#googleLoginBtn')?.addEventListener('click',async()=>{
    try{if(!supabase)throw new Error('Supabase client did not load.');const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+link('index.html')}});if(error)throw error;}
    catch(err){$('#authNotice').textContent=err.message||'Google sign-in could not start.';toast(err.message||'Google sign-in failed.');}
  });
}
function legal(which){let data=which==='privacy'?['Privacy Policy','We will collect only information needed to operate accounts, listings, orders and customer support.','Personal data will be protected and shared only where needed to provide marketplace services or meet legal obligations.']:which==='terms'?['Terms & Conditions','Users must provide accurate listing information and communicate honestly with other marketplace participants.','ISOKO PLUS will publish complete transaction, payment, refund and dispute rules before public launch.']:['Delivery & Returns','Delivery timing depends on destination, item availability and transport arrangements.','Inspect items on delivery and report missing, damaged or incorrect items through the official support process.'];shell(`<main><section class="page-hero"><div class="container page-heading"><span class="eyebrow">ISOKO PLUS INFORMATION</span><h1>${data[0]}</h1><p>Important information for marketplace users.</p></div></section><section class="section"><div class="container" style="max-width:850px"><div class="content-card"><h2>1. Overview</h2><p>${data[1]}</p><h2>2. User responsibilities</h2><p>${data[2]}</p><h2>3. Before launch</h2><p>These are preview policy pages. Final legal terms, payment arrangements, privacy disclosures and consumer protections must be reviewed and approved before the marketplace goes live.</p></div></div></section></main>`)}
async function dashboard(role){
  if(!(await requireRole(role)))return;
  const title=role==='admin'?'Admin':role==='seller'?'Seller':'Buyer / Renter';
  const myProducts=dbProducts.filter(p=>p.seller_id===currentUser.id);
  const stats=role==='admin'?[['Total users','—'],['Live listings',dbProducts.length],['Orders','—'],['Pending reviews','—']]:role==='seller'?[['My listings',myProducts.length],['Active orders','—'],['Completed sales','—'],['Earnings','—']]:[['My orders','—'],['Active rentals','—'],['Completed','—'],['Saved items','—']];
  const side=role==='admin'?['Overview','Users','Sellers','Listings','Orders','Payments','Deliveries','Disputes','Reports','Settings']:role==='seller'?['Overview','My listings','Add product','Orders & rentals','Payout details','Profile']:['Overview','My orders','My rentals','Payment history','Notifications','Profile'];
  shell(`<main><div class="container dashboard-layout"><aside class="sidebar"><h3>ISOKO PLUS<br><small style="color:#a9c0b0;font-weight:500">${title} workspace</small></h3>${side.map((x,i)=>`<a class="side-link ${i===0?'active':''}" href="#${x.toLowerCase().replace(/[^a-z]+/g,'-')}">${x}</a>`).join('')}<a class="side-link" href="${link('index.html')}">← View marketplace</a></aside><section class="dash-main"><div class="dash-head"><div><span class="eyebrow">${title.toUpperCase()} WORKSPACE</span><h1>Welcome, ${esc(currentProfile.full_name||currentUser.email)} 👋</h1><p class="mobile-note">${esc(currentUser.email)} · ${esc(currentProfile.role)}</p></div>${role==='seller'?'<button class="btn btn-primary" id="addProductBtn">＋ Add product</button>':''}</div>${role==='buyer'?`<div class="content-card" style="margin:18px 0"><h2 style="margin-top:0">Open a Business Account</h2><p class="mobile-note">Want to sell or lend products? Verify your phone number first. We will send you a one-time SMS code.</p><form id="businessVerifyForm"><div class="form-grid"><div class="field full"><label>Phone number (include country code)</label><input id="businessPhone" type="tel" required placeholder="+2507XXXXXXXX" autocomplete="tel"></div><div class="field full"><button class="btn btn-primary" id="sendBusinessCode">Send verification code</button></div><div class="field full" id="businessCodeArea" hidden><label>SMS verification code</label><input id="businessOtp" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the code received"><button class="btn btn-primary" id="verifyBusinessCode" type="button" style="margin-top:10px">Verify phone & activate Business Account</button></div></div></form><div class="notice" id="businessVerifyNotice">Your normal Buyer account remains active. Business verification is required only when you want to sell or lend.</div></div>`:''}<div class="stat-grid">${stats.map(x=>`<div class="stat-card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div>${role==='seller'?`<div class="content-card" id="addProductPanel"><h2 style="margin-top:0">Create a listing</h2><p class="mobile-note">Your listing is securely saved to the ISOKO PLUS database. It may need admin approval before appearing publicly.</p><form id="productForm"><div class="form-grid"><div class="field"><label>Product title</label><input name="title" required placeholder="e.g. Samsung Galaxy phone"></div><div class="field"><label>Listing type</label><select name="mode"><option value="sale">For sale</option><option value="rent">For rent</option></select></div><div class="field"><label>Category</label><select name="category">${categories.map(c=>`<option>${c[1]}</option>`).join('')}</select></div><div class="field"><label>Price (RWF)</label><input name="price" type="number" min="1" required placeholder="Price"></div><div class="field"><label>Rental period</label><select name="period"><option>day</option><option>week</option><option>month</option></select></div><div class="field"><label>Location</label><input name="location" placeholder="Kigali"></div><div class="field full"><label>Photo URL (optional)</label><input name="image" type="url" placeholder="https://..."></div><div class="field full"><label>Description</label><textarea name="description" placeholder="Describe your product"></textarea></div><div class="field full"><button class="btn btn-primary" id="saveProductBtn">Publish listing →</button></div></div></form></div>`:''}<div class="section-head" style="margin-top:28px"><div><h2 style="font-size:22px">${role==='seller'?'My listings':role==='admin'?'Marketplace listings':'Marketplace activity'}</h2><p>Live information loaded from Supabase.</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr>${role==='seller'?'<th>Product</th><th>Price</th><th>Type</th><th>Status</th>':'<th>Information</th><th>Status</th><th>Updated</th>'}</tr></thead><tbody id="dashboardRows">${role==='seller'?myProducts.map(p=>`<tr><td>${esc(p.title)}</td><td>${money(p.price)}</td><td>${esc(p.mode)}</td><td><span class="status pending">${esc(p.status||'pending')}</span></td></tr>`).join(''):'<tr><td>Account authenticated</td><td><span class="status">Connected</span></td><td>Now</td></tr>'}</tbody></table></div><div class="notice">Your account role is verified by Supabase Row Level Security. Admin permissions must be granted manually by the project owner.</div><button class="btn btn-outline" id="logoutDashBtn">Log out</button></section></div></main>`);
  const logout=async()=>{await supabase.auth.signOut();location.href=link('index.html')};
  $('#logoutDashBtn')?.addEventListener('click',logout);
  $('#businessVerifyForm')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#sendBusinessCode'),phone=$('#businessPhone').value.trim(),note=$('#businessVerifyNotice');
    btn.disabled=true;btn.textContent='Sending code…';
    try{
      if(!/^\+[1-9]\d{7,14}$/.test(phone))throw new Error('Enter a valid phone number with country code, for example +2507XXXXXXXX.');
      const {error}=await supabase.auth.updateUser({phone});
      if(error)throw error;
      $('#businessCodeArea').hidden=false;
      note.textContent='A verification code has been requested. Check your SMS messages and enter the code below.';
      toast('Verification code requested.');
    }catch(err){note.textContent=err.message||'Could not send SMS code.';toast(err.message||'Could not send SMS code.');}
    finally{btn.disabled=false;btn.textContent='Send verification code';}
  });
  $('#verifyBusinessCode')?.addEventListener('click',async()=>{
    const btn=$('#verifyBusinessCode'),phone=$('#businessPhone').value.trim(),token=$('#businessOtp').value.trim(),note=$('#businessVerifyNotice');
    btn.disabled=true;btn.textContent='Verifying…';
    try{
      if(!token)throw new Error('Enter the SMS code first.');
      const {error}=await supabase.auth.verifyOtp({phone,token,type:'phone_change'});
      if(error)throw error;
      const {error:roleError}=await supabase.rpc('isoko_activate_business_account');
      if(roleError)throw roleError;
      await loadCurrentProfile();
      toast('Business Account verified successfully.');
      note.textContent='Your phone number is verified. Your Business Account is now active.';
      location.href=dashboardUrl('seller');
    }catch(err){note.textContent=err.message||'Verification failed.';toast(err.message||'Verification failed.');}
    finally{btn.disabled=false;btn.textContent='Verify phone & activate Business Account';}
  });
  $('#addProductBtn')?.addEventListener('click',()=>$('#addProductPanel').scrollIntoView({behavior:'smooth'}));
  $('#productForm')?.addEventListener('submit',async e=>{
    e.preventDefault();const btn=$('#saveProductBtn');btn.disabled=true;btn.textContent='Saving…';
    const f=new FormData(e.target);
    const payload={seller_id:currentUser.id,title:String(f.get('title')).trim(),mode:f.get('mode'),category:f.get('category'),price:Number(f.get('price')),rental_period:f.get('period'),location:String(f.get('location')||'').trim(),image_url:String(f.get('image')||'').trim()||null,description:String(f.get('description')||'').trim(),status:'pending'};
    try{const {error}=await supabase.from('products').insert(payload);if(error)throw error;toast('Listing submitted for review.');location.reload();}
    catch(err){toast(err.message||'Could not save listing.');btn.disabled=false;btn.textContent='Publish listing →';}
  });
}
await loadCurrentProfile();
if(supabase){await loadMarketplaceData();}
document.addEventListener('click',async e=>{if(e.target&&e.target.id==='logoutBtn'){await supabase.auth.signOut();location.href=link('index.html');}});
switch(page){case'home':home();break;case'buy':listing('sale');break;case'rent':listing('rent');break;case'categories':categoriesPage();break;case'product':productPage();break;case'about':about();break;case'contact':contact();break;case'login':auth(false);break;case'register':auth(true);break;case'terms':legal('terms');break;case'privacy':legal('privacy');break;case'delivery':legal('delivery');break;case'admin':dashboard('admin');break;case'seller':dashboard('seller');break;case'buyer':dashboard('buyer');break;default:home()}
})();

</script>
</body>
</html>
